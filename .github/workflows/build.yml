name: Verify Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: oniro-runner
    container:
      image: node:22-bookworm
    env:
      HOME: /root
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java and Oniro tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends openjdk-17-jdk-headless
          npm install -g @oniroproject/oniro-app@0.10.0
          oniro-app sdk install 6.1
          oniro-app cmdtools install

      - name: Build and sign app
        run: |
          cd "$GITHUB_WORKSPACE"
          cp build-profile.example.json5 build-profile.json5
          oniro-app sign
          oniro-app build

      - name: Upload built HAP packages
        uses: actions/upload-artifact@v4
        with:
          name: HAP packages
          path: entry/build/default/outputs/default
